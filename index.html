<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF8FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1033" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Your own feed. Everything you meant to come back to, from texts, email, notes and links, handed back a few at a time until you're done.">
  <meta property="og:title" content="Shoebox: Your Own Feed">
  <meta property="og:description" content="Everything you meant to come back to, in one feed made only of what you chose. A few at a time, until you're done.">
  <meta property="og:image" content="https://inmyshoebox.com/site/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shoebox">
  <title>Shoebox</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // A first visit in a browser gets the front page; the app itself opens for the iPhone apps, the Home Screen
    // app, links into the app (?app=1, ?share=1, ?me=1) and anyone who has used it here before.
    try {
      var q = location.search, ls = localStorage;
      if (/[?&]app=1/.test(q)) ls.setItem("edition.web", "1");
      var inApp = window.shoeboxNative || /[?&](native|me|share|app)=/.test(q) || (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
      if (!inApp && !ls.getItem("edition.web") && !ls.getItem("edition.onboarded") && !ls.getItem("edition.inboxKey")) location.replace("welcome" + location.hash);
    } catch (e) {}
  </script>
  <script>
    // Appearance chosen in Settings, applied before the first paint so the screen never flashes the other look.
    try { var t = localStorage.getItem("edition.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); if (localStorage.getItem("edition.palette") === "plain") document.documentElement.setAttribute("data-palette", "plain"); } catch (e) {}
  </script>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-label="Loading Shoebox">
    <svg class="splash-mark" aria-hidden="true" focusable="false" viewBox="0 0 64 64"><rect width="64" height="64" rx="14.5" style="fill:var(--logo-tile)"/><svg x="10" y="9" width="44" height="44" viewBox="0 0 64 64" overflow="visible"><rect x="10.5" y="20" width="9" height="16" rx="2" style="fill:var(--logo-card)"/><rect x="21.5" y="16.5" width="10" height="19.5" rx="2" style="fill:var(--logo-card)"/><rect x="33.5" y="19" width="9" height="17" rx="2" style="fill:var(--logo-card)"/><path d="M5 31h54v19a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z" style="fill:var(--logo-box)"/><g class="lid" transform="rotate(-16 6 26)"><rect x="3" y="17" width="58" height="10" rx="3" style="fill:var(--logo-lid)"/></g></svg></svg>
    <p class="splash-name">Shoebox</p>
    <p class="splash-line">Keep it. Come back to it.</p>
  </div>
  <div id="app" class="app"></div>
  <noscript>Shoebox needs JavaScript.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
