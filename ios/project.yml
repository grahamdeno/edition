# Shoebox for iPhone: the Shoebox web app in a native shell, plus a share
# extension (Shoebox in the share sheet) and a home-screen widget.
# Built in the cloud by .github/workflows/ios.yml; no Mac needed.
name: Shoebox
options:
  bundleIdPrefix: com.grahamdeno
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 7MHDTK68M2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Shoebox:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Privacy/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    dependencies:
      - target: ShoeboxShare
      - target: ShoeboxWidget
    entitlements:
      path: App/Shoebox.entitlements
      properties:
        com.apple.security.application-groups: [group.com.grahamdeno.shoebox]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.grahamdeno.shoebox]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.grahamdeno.shoebox]
        com.apple.developer.icloud-services: [CloudDocuments]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shoebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take a photo to save in Shoebox.
        NSPhotoLibraryUsageDescription: Choose photos to save in Shoebox.
        NSMicrophoneUsageDescription: Record a voice note for Shoebox.
        WKAppBoundDomains: [shoebox.tangomike.app, www.youtube-nocookie.com, www.youtube.com, player.vimeo.com]
        NSUbiquitousContainers:
          iCloud.com.grahamdeno.shoebox:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Shoebox
            NSUbiquitousContainerSupportedFolderLevels: Any
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCalendarsFullAccessUsageDescription: Shoebox shows today's events at the top of your morning. They stay on your iPhone.
        NSLocationWhenInUseUsageDescription: Shoebox uses your rough location for the morning weather.
        CFBundleURLTypes:
          - CFBundleURLName: com.grahamdeno.shoebox
            CFBundleURLSchemes: [shoebox]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.shoebox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ShoeboxShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.com.grahamdeno.shoebox]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Shoebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 5
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.shoebox.share
  ShoeboxWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.grahamdeno.shoebox]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Shoebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.shoebox.widget
schemes:
  Shoebox:
    build:
      targets:
        Shoebox: all
    archive:
      config: Release
